<!DOCTYPE html>
<html lang="pt-br" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/output.css">
    <title>Positions (static, sticky, fixed, absolute)</title>
</head>

<body class="bg-gray-800">

    <header class="sticky top-0 bg-white shadow-md p-4 z-50">
        Cabeçalho Sticky
    </header>

    <div class="h-[1500px]">
        <div class="relative bg-blue-100 p-6 rounded-md shadow-md max-w-sm mx-auto mt-10">
            <p>Este é um card com selo usando relative + absolute</p>
            <div class="absolute top-0 right-0 bg-blue-500 text-white text-xs font-bold px-2 py-1 rounded-bl-md">
                NOVO
            </div>
        </div>
    </div>

    <button class="fixed bottom-6 right-6 bg-sky-700 text-white px-4 py-2 rounded-lg shadow-2xl">
        Ajuda
    </button>
</body>

</html>
